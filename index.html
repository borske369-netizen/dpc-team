<!DOCTYPE html>
<!-- Copyright 2026 David Borske. All rights reserved. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DPC">
<meta name="description" content="Field tracker for a door to door fiber team. Contacts, presentations, asks and sales, tracked separately.">
<title>DPC Field Tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,800&display=swap">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./cb-extra.css">
<link rel="stylesheet" href="./events.css">
<link rel="stylesheet" href="./nudge.css">
</head>
<body>

<div class="appbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-label="DPC">
      <rect x="2" y="20" width="7" height="9" rx="2" fill="#2E7F7B"/>
      <rect x="12.5" y="13" width="7" height="16" rx="2" fill="#4FB3AE"/>
      <rect x="23" y="4" width="7" height="25" rx="2" fill="#E8F0F1"/>
    </svg>
    <span>DPC</span>
  </div>
  <div class="spacer"></div>
  <span class="net" id="net">Ready</span>
  <a class="ghost sm hcbtn ownlink" id="ownlink" href="#owner" hidden aria-label="Owner page">Owner</a>
  <button class="ghost sm hcbtn" id="topsignout" data-cl="leave" hidden>Sign out</button>
  <button class="ghost sm hcbtn" id="keybtn" hidden aria-expanded="false" aria-controls="keypanel">Key</button>
  <button class="ghost sm hcbtn" id="hcbtn" aria-pressed="false" aria-label="High contrast">Aa</button>
  <button class="ghost sm" id="installbtn" hidden>Install</button>
</div>
<div id="keypanel" class="keypanel" hidden>
  <div class="joinrow"><input data-clswitch="1" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="22" placeholder="Type any key" aria-label="Any key"><button class="primary" data-cl="switchkey">Go</button></div>
  <p class="fine">Rep, manager or owner key. It takes you to the right place.</p>
  <button class="ghost sm" id="signoutbtn" data-cl="leave" hidden>Sign this phone out</button>
</div>

<main id="root"></main>

<footer class="legal">
  &copy; 2026 David Borske. All rights reserved. This tracker, its method and the game board
  are his property. Provided for use by his team only. No license, assignment or work made for
  hire is granted or implied by its use.
</footer>

<nav class="tabbar" id="tabs">
  <button data-view="rep" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21V7l7-4 7 4v14"/><path d="M9 21v-6h4v6"/></svg>
    My day
  </button>
  <button data-view="board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="16" rx="1.5"/></svg>
    Board
  </button>
  <button data-view="goals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
    Goals
  </button>
  <button data-view="routine">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9l1.5 1.5L12 8"/><path d="M8 15l1.5 1.5L12 14"/><path d="M14.5 9.5H17"/><path d="M14.5 15.5H17"/></svg>
    Routine
  </button>
  <button data-view="contacts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/></svg>
    Contacts
  </button>
  <button data-view="manager">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 20h18"/><path d="M6 20V10"/><path d="M11 20V4"/><path d="M16 20v-7"/></svg>
    Team
  </button>
</nav>

<script type="module" src="./app.js"></script>
</body>
</html>
