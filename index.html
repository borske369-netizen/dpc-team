<!DOCTYPE html>
<!-- Copyright 2026 David Borske. All rights reserved. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DPC">
<meta name="description" content="Field tracker for a door to door fiber team. Contacts, presentations, asks and sales, tracked separately.">
<title>DPC Field Tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,800&display=swap">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./cb-extra.css">
<link rel="stylesheet" href="./events.css">
<link rel="stylesheet" href="./nudge.css">
</head>
<body>

<div class="appbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-label="DPC">
      <rect x="2" y="20" width="7" height="9" rx="2" fill="#2E7F7B"/>
      <rect x="12.5" y="13" width="7" height="16" rx="2" fill="#4FB3AE"/>
      <rect x="23" y="4" width="7" height="25" rx="2" fill="#E8F0F1"/>
    </svg>
    <span>DPC</span>
  </div>
  <div class="spacer"></div>
  <span class="net" id="net">Ready</span>
  <button class="ghost sm hcbtn" id="hcbtn" aria-pressed="false" aria-label="High contrast">Aa</button>
  <button class="ghost sm" id="installbtn" hidden>Install</button>
</div>

<main id="root"></main>

<footer class="legal">
  &copy; 2026 David Borske. All rights reserved. This tracker, its method and the game board
  are his property. Provided for use by his team only. No license, assignment or work made for
  hire is granted or implied by its use.
</footer>

<nav class="tabbar" id="tabs">
  <button data-view="rep" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 21V7l7-4 7 4v14"/><path d="M9 21v-6h4v6"/></svg>
    My day
  </button>
  <button data-view="board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="16" rx="1.5"/></svg>
    Game board
  </button>
  <button data-view="manager">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 20h18"/><path d="M6 20V10"/><path d="M11 20V4"/><path d="M16 20v-7"/></svg>
    Team
  </button>
</nav>

<script type="module" src="./app.js"></script>
</body>
</html>
